# nginx joue 2 rôles :
#  1) servir les fichiers statiques Angular (HTML/JS/CSS)
#  2) reverse proxy : tout ce qui commence par /api part vers le back-end Spring Boot
# => le navigateur ne parle qu'à UNE seule origine : pas de problème CORS,
#    et le back-end n'est jamais exposé directement sur Internet.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Santé de l'appli complète (utile plus tard pour un load balancer AWS)
    location = /health {
        proxy_pass http://backend:8080/actuator/health;
    }

    # Fichiers avec hash dans le nom => cache long
    # (on utilise "expires" et pas "add_header" ici : un add_header dans une
    #  location annulerait les en-têtes de sécurité définis plus haut)
    location ~* \.(js|css|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Routes Angular (/vehicules, /conducteurs...) => toujours index.html
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
